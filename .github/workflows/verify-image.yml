name: Verify existing image digest

on:
  push:
    branches:
      - main
    paths:
      - scripts/smoke-image.sh
      - tests/**
      - .github/workflows/verify-image.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/smoke-image.sh
      - tests/**
      - .github/workflows/verify-image.yml
  workflow_dispatch:
    inputs:
      image_digest:
        description: Existing GHCR image index digest (no build or tag updates)
        required: true
        type: string
        default: sha256:516d09ab47086f9255ad0885deaa17ea9ed1568a514a40fef49b36cdf1d3519a
      upstream_version:
        description: Expected upstream stable release version
        required: true
        type: string
        default: v26.11.1

permissions:
  contents: read

concurrency:
  group: verify-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v

  verify:
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest || 'sha256:516d09ab47086f9255ad0885deaa17ea9ed1568a514a40fef49b36cdf1d3519a' }}
      UPSTREAM_VERSION: ${{ inputs.upstream_version || 'v26.11.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate immutable image reference and expected version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Expected a SHA-256 image index digest, not a tag." >&2
            exit 1
          }
          [[ "$UPSTREAM_VERSION" =~ ^v?[0-9]+[.][0-9]+[.][0-9]+$ ]] || {
            echo "Expected a stable release version with an optional leading v." >&2
            exit 1
          }

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with read-only package permission
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify existing amd64 and arm64 image manifests
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/develata/ustc-iwan-docker@${IMAGE_DIGEST}"
          sh scripts/smoke-image.sh "$image" "$UPSTREAM_VERSION"
