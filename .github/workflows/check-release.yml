name: Check upstream release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - UPSTREAM_VERSION
      - UPSTREAM_SHA256S
      - .github/workflows/check-release.yml
  schedule:
    # GitHub cron uses day-of-month semantics. This is approximately every
    # five days; month boundaries can make one interval shorter or longer.
    - cron: "17 4 */5 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-upstream-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPO: yyy1mu/ustc-iwan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read latest stable release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/${UPSTREAM_REPO}/releases/latest")"
          latest="$(jq -r '.tag_name' <<<"$json")"
          draft="$(jq -r '.draft' <<<"$json")"
          prerelease="$(jq -r '.prerelease' <<<"$json")"

          if [[ -z "$latest" || "$latest" == "null" || "$draft" != "false" || "$prerelease" != "false" ]]; then
            echo "Latest GitHub release is not a usable stable release." >&2
            exit 1
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest stable upstream release: $latest"

      - name: Download required release assets and calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          latest='${{ steps.release.outputs.latest }}'
          mkdir -p .upstream-assets

          for asset in \
            iwan-client-oidc-x86_64-musl \
            iwan-client-oidc-aarch64-musl
          do
            gh release download "$latest" \
              --repo "$UPSTREAM_REPO" \
              --pattern "$asset" \
              --dir .upstream-assets
          done

          (
            cd .upstream-assets
            sha256sum \
              iwan-client-oidc-x86_64-musl \
              iwan-client-oidc-aarch64-musl
          ) > /tmp/upstream-sha256s

          cat /tmp/upstream-sha256s

      - name: Determine whether an update PR is needed
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          latest='${{ steps.release.outputs.latest }}'
          current="$(tr -d '[:space:]' < UPSTREAM_VERSION)"

          checksum_complete=true
          for asset in iwan-client-oidc-x86_64-musl iwan-client-oidc-aarch64-musl; do
            if ! grep -Eq "^[0-9a-f]{64}[[:space:]]+${asset}$" UPSTREAM_SHA256S; then
              checksum_complete=false
            fi
          done

          if [[ "$latest" == "$current" && "$checksum_complete" == "true" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already tracking ${current} with complete checksums."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "current=$current" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare update branch
        if: steps.diff.outputs.needed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          latest='${{ steps.release.outputs.latest }}'
          branch="bot/update-ustc-iwan-${latest//\//-}"

          printf '%s\n' "$latest" > UPSTREAM_VERSION
          {
            echo '# SHA-256 values for the upstream GitHub Release assets pinned by UPSTREAM_VERSION.'
            echo '# Generated by .github/workflows/check-release.yml.'
            cat /tmp/upstream-sha256s
          } > UPSTREAM_SHA256S

          # Keep the repository's example deployment pinned to the reviewed release.
          sed -i -E "s#IWAN_IMAGE_TAG=v[^[:space:]]+#IWAN_IMAGE_TAG=${latest}#" .env.example
          sed -i -E "s#\$\{IWAN_IMAGE_TAG:-v[^}]+\}#\$\{IWAN_IMAGE_TAG:-${latest}\}#" compose.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add UPSTREAM_VERSION UPSTREAM_SHA256S .env.example compose.yaml
          git commit -m "chore: update ustc-iwan to ${latest}"
          git push --force-with-lease origin "HEAD:${branch}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest='${{ steps.release.outputs.latest }}'
          current='${{ steps.diff.outputs.current }}'
          branch='${{ steps.branch.outputs.branch }}'

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Update PR already exists: #${existing}"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update ustc-iwan to ${latest}" \
            --body "Automated upstream stable Release update.\n\n- Previous pin: \`${current}\`\n- New pin: \`${latest}\`\n- Source: https://github.com/${UPSTREAM_REPO}/releases/tag/${latest}\n- Required amd64/arm64 assets were downloaded successfully.\n- SHA-256 values are recorded in \`UPSTREAM_SHA256S\`.\n\nThis PR is intentionally **not** auto-merged. Review the upstream release notes and merge manually when ready."
