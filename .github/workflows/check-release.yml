name: Publish upstream stable release

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses day-of-month semantics. This is approximately every
    # five days; month boundaries can make one interval shorter or longer.
    - cron: "17 4 */5 * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-upstream-stable-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: yyy1mu/ustc-iwan
  IMAGE: ghcr.io/develata/ustc-iwan-docker

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test entrypoint downloads and checksum enforcement
        run: python3 -m unittest discover -s tests -v

      - name: Read latest stable upstream release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          json="$(curl -fsSL --retry 3 "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest")"
          version="$(jq -r '.tag_name' <<<"$json")"
          draft="$(jq -r '.draft' <<<"$json")"
          prerelease="$(jq -r '.prerelease' <<<"$json")"

          if [[ -z "$version" || "$version" == "null" || "$draft" != "false" || "$prerelease" != "false" ]]; then
            echo "Latest GitHub release is not a usable stable release." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest stable upstream release: $version"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether immutable version tag already exists
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          if docker buildx imagetools inspect "${IMAGE}:${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${version} already exists; no upstream release publish is needed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download required upstream assets and calculate SHA-256
        if: steps.exists.outputs.exists != 'true'
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          mkdir -p .upstream-assets/amd64 .upstream-assets/arm64

          base="https://github.com/${UPSTREAM_REPO}/releases/download/${version}"
          curl -fL --retry 3 --retry-delay 2 \
            "${base}/iwan-client-oidc-linux-x86_64-musl.zip" \
            -o .upstream-assets/amd64.zip
          curl -fL --retry 3 --retry-delay 2 \
            "${base}/iwan-client-oidc-linux-aarch64-musl.zip" \
            -o .upstream-assets/arm64.zip

          unzip -q .upstream-assets/amd64.zip -d .upstream-assets/amd64
          unzip -q .upstream-assets/arm64.zip -d .upstream-assets/arm64

          test -f .upstream-assets/amd64/iwan-client-oidc-linux-x86_64-musl
          test -f .upstream-assets/arm64/iwan-client-oidc-linux-aarch64-musl

          sha_amd64="$(sha256sum .upstream-assets/amd64/iwan-client-oidc-linux-x86_64-musl | awk '{print $1}')"
          sha_arm64="$(sha256sum .upstream-assets/arm64/iwan-client-oidc-linux-aarch64-musl | awk '{print $1}')"

          echo "sha_amd64=$sha_amd64" >> "$GITHUB_OUTPUT"
          echo "sha_arm64=$sha_arm64" >> "$GITHUB_OUTPUT"
          echo "amd64 SHA-256: $sha_amd64"
          echo "arm64 SHA-256: $sha_arm64"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable version plus stable
        if: steps.exists.outputs.exists != 'true'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            IWAN_VERSION=${{ steps.release.outputs.version }}
            IWAN_SHA256_AMD64=${{ steps.assets.outputs.sha_amd64 }}
            IWAN_SHA256_ARM64=${{ steps.assets.outputs.sha_arm64 }}
          tags: |
            ghcr.io/develata/ustc-iwan-docker:${{ steps.release.outputs.version }}
            ghcr.io/develata/ustc-iwan-docker:stable
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Unofficial Docker wrapper for yyy1mu/ustc-iwan native SOCKS5 mode
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            io.develata.ustc-iwan.upstream=https://github.com/yyy1mu/ustc-iwan
            io.develata.ustc-iwan.upstream-version=${{ steps.release.outputs.version }}
            io.develata.ustc-iwan.sha256-amd64=${{ steps.assets.outputs.sha_amd64 }}
            io.develata.ustc-iwan.sha256-arm64=${{ steps.assets.outputs.sha_arm64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image cold start on both architectures
        if: steps.exists.outputs.exists != 'true'
        env:
          PUBLISHED_IMAGE: ghcr.io/develata/ustc-iwan-docker@${{ steps.image.outputs.digest }}
          UPSTREAM_VERSION: ${{ steps.release.outputs.version }}
        run: sh scripts/smoke-image.sh "$PUBLISHED_IMAGE" "$UPSTREAM_VERSION"

      - name: Verify existing immutable version on both architectures
        if: steps.exists.outputs.exists == 'true'
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # A previous run may have pushed tags before its smoke test failed.
          # Recheck existing versioned images instead of silently skipping them.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${UPSTREAM_VERSION}" | awk '$1 == "Digest:" { print $2; exit }')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the immutable image index digest." >&2
            exit 1
          fi
          sh scripts/smoke-image.sh "${IMAGE}@${digest}" "$UPSTREAM_VERSION"
